# Example only — replace image/build with your Hermes fork and add TLS (Caddy/Traefik).
services:
  hermes:
    # image: your-registry/aether-hermes:latest
    build: .
    ports:
      - "8642:8642"
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: "${HERMES_API_KEY}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
    volumes:
      - hermes-data:/root/.hermes
    restart: unless-stopped

volumes:
  hermes-data:

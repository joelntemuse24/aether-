# Same contract as the repo-root railway.toml.
# Point the Railway service "Config file" at /deploy/hermes/railway.toml
# if you do not want the root file. Build context stays the repo root.
#
# Do NOT set startCommand (replaces official ENTRYPOINT / s6).

[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/hermes/Dockerfile"
watchPatterns = ["deploy/hermes/**", "railway.toml", "Dockerfile"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

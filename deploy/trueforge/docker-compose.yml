# Hosted opt-in: set TRUEFORGE_DATABASE_URL, REDIS_URL, TRUEFORGE_API_KEY and
# POSTGRES_PASSWORD, then `docker compose --profile hosted up -d --build`.
# Container URLs use postgres:5432 and redis:6379; default remains SQLite.
services:
  trueforge:
    build:
      context: ../..
      dockerfile: deploy/trueforge/Dockerfile
    ports:
      - "8790:8790"
    environment:
      AETHER_TRUEFORGE_TOKEN: ${AETHER_TRUEFORGE_TOKEN:?set AETHER_TRUEFORGE_TOKEN}
      AETHER_HOSTED_BUZZ_API_KEY: ${AETHER_HOSTED_BUZZ_API_KEY:-}
      AETHER_HOSTED_BUZZ_BASE_URL: ${AETHER_HOSTED_BUZZ_BASE_URL:-}
      AETHER_HOSTED_CLAUDE_API_KEY: ${AETHER_HOSTED_CLAUDE_API_KEY:-}
      AETHER_HOSTED_CLAUDE_BASE_URL: ${AETHER_HOSTED_CLAUDE_BASE_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      TRUEFORGE_DATABASE_URL: ${TRUEFORGE_DATABASE_URL:-}
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-}
      TRUEFORGE_REDIS_URL: ${TRUEFORGE_REDIS_URL:-}
      TRUEFORGE_API_KEY: ${TRUEFORGE_API_KEY:-}
      STANDALONE: ${STANDALONE:-}
      APP_DATA_DIR_SUFFIX: aether
      HOME: /data
    networks: [default, trueforge-internal]
    volumes:
      - trueforge-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8790/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  postgres:
    profiles: ["hosted"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trueforge}
      POSTGRES_USER: ${POSTGRES_USER:-trueforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - trueforge-postgres-data:/var/lib/postgresql/data
    networks: [trueforge-internal]
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8

  redis:
    profiles: ["hosted"]
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - trueforge-redis-data:/data
    networks: [trueforge-internal]
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8

  # Separate process. Not started by `docker compose up` and not reloaded by health-gate.sh.
  # `docker compose --profile agent up` only. Do not set AETHER_TOOL_CONTEXT_KEY here.
  agent:
    profiles: ["agent"]
    build:
      context: ../..
      dockerfile: deploy/trueforge/Dockerfile
    command: ["npx", "tsx", "src/agent-server/server.ts"]
    ports:
      - "127.0.0.1:8792:8792"
    environment:
      AETHER_TRUEFORGE_TOKEN: ${AETHER_TRUEFORGE_TOKEN:?set AETHER_TRUEFORGE_TOKEN}
      AETHER_AGENT_HOST: 0.0.0.0
      AETHER_AGENT_PORT: "8792"
      AETHER_HOSTED_BUZZ_API_KEY: ${AETHER_HOSTED_BUZZ_API_KEY:-}
      AETHER_HOSTED_BUZZ_BASE_URL: ${AETHER_HOSTED_BUZZ_BASE_URL:-}
      AETHER_HOSTED_CLAUDE_API_KEY: ${AETHER_HOSTED_CLAUDE_API_KEY:-}
      AETHER_HOSTED_CLAUDE_BASE_URL: ${AETHER_HOSTED_CLAUDE_BASE_URL:-}
    restart: unless-stopped

volumes:
  trueforge-data:
  trueforge-postgres-data:
  trueforge-redis-data:

networks:
  trueforge-internal:
    internal: true

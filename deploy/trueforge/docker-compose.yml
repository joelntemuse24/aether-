services:
  trueforge:
    build:
      context: ../..
      dockerfile: deploy/trueforge/Dockerfile
    ports:
      - "8790:8790"
    environment:
      AETHER_TRUEFORGE_TOKEN: ${AETHER_TRUEFORGE_TOKEN:?set AETHER_TRUEFORGE_TOKEN}
      AETHER_HOSTED_BUZZ_API_KEY: ${AETHER_HOSTED_BUZZ_API_KEY:-}
      AETHER_HOSTED_BUZZ_BASE_URL: ${AETHER_HOSTED_BUZZ_BASE_URL:-}
      AETHER_HOSTED_CLAUDE_API_KEY: ${AETHER_HOSTED_CLAUDE_API_KEY:-}
      AETHER_HOSTED_CLAUDE_BASE_URL: ${AETHER_HOSTED_CLAUDE_BASE_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      APP_DATA_DIR_SUFFIX: aether
      HOME: /data
    volumes:
      - trueforge-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8790/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

volumes:
  trueforge-data:

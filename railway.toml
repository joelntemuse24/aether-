# Aether chat — long-lived `next start` (no Vercel function wall clock).
# Optional / deprecated Hermes gateway: deploy/hermes/railway.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["src/**", "package.json", "package-lock.json", "Dockerfile", "railway.toml"]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
